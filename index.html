        .btn:hover { color: #fff; padding-left: 35px; background: rgba(188, 19, 254, 0.1); border-color: var(--neon); transform: translateY(-2px); }
        .btn:hover i { left: 20px; }
        .btn:nth-child(1) { animation-delay: 0.1s; }
        .btn:nth-child(2) { animation-delay: 0.2s; }
        .btn:nth-child(3) { animation-delay: 0.3s; }

<body>

        <div class="avatar-wrapper"><img src="assets/avatar.png" class="avatar"><div id="status-dot" class="status-dot"></div></div>
        <div class="title-container"><h1>Im_Danokツ</h1><div class="separator"></div><div class="links-label">LINKS</div></div>
        <div class="activity-box">
            <div class="activity-icon" id="activity-icon"></div>
            <div class="activity-info">
                <span class="activity-label" id="activity-label">Status</span>

        </div>
    </div>
    <script>
        const cursor = document.getElementById('cursor');
        let firstMove = false;
        document.addEventListener('mousemove', (e) => {
            if (!firstMove) { cursor.style.display = 'block'; firstMove = true; }
            cursor.style.transform = `translate3d(${e.clientX}px, ${e.clientY}px, 0)`;
        });

        const gameStatusData = {
            hsr: { icon: "assets/images.jfif", texts: ["Путешествует по Двухмернии", "Тестирует Виртуальную Вселенную", "Ищет сундуки на Лофу", "Сражается со Стеллароном", "Тратит энергию Освоения", "Проходит Зал забвения", "Осматривает Звездный экспресс", "Беседует с Пом-Пом", "Выбивает артефакты", "Прокачивает световые конусы", "Выполняет заказы Герты", "Слушает лекции Вельта", "Смотрит новости Межзвездного мира", "Изучает Нашествие роя", "Ищет Кафку", "Считает кредиты", "Проходит Чистый вымысел", "Сражается в Иллюзии конца", "Проходит режим Золото и шестерёнки"] },
            endfield: { icon: "assets/эндфилд.jfif", texts: ["Проводит логистику завода", "Создает чертеж", "Исследует Талос-II", "Оптимизирует производство", "Путешествует по Долине IV", "Проверяет датчики", "Настраивает энергосеть", "Управляет дронами-разведчиками", "Собирает ресурсы", "Анализирует аномалии", "Укрепляет оборону базы", "Сканирует местность", "Разрабатывает новые технологии", "Следит за реактором", "Строит конвейерные ленты", "Настраивает автоматизацию", "Изучает протоколы Эндфилда", "Отражает нападение Аггелосов"] },
            zzz: { icon: "assets/ззз.jfif", texts: ["Исследует нулевую каверну", "Проходит беспощадную охоту", "Пьёт кофе у Тин", "Выбивает S-ранг", "Чинит видеопрокат", "Ищет Банбу", "Закрывает заказ Интернота", "Слушает пластинки в 6-м секторе", "Проверяет VR-тренировки", "Сражается с эфириалами", "Копит полихромы", "Покупает лапшу", "Изучает архив прокси", "Взламывает защиту каверны", "Тюнингует Банбу", "Смотрит пост в Интерноте"] },
            tundra: { icon: "assets/тундра.png", texts: ["Фармит серебряные львы", "Попадание в пулемет", "Тестирует новую технику", "Горит в танке", "Ловит рикошет", "Атакуйте точку А!", "Атакуйте точку D!", "Сбивает самолет на ЗСУ", "Ищет Д-6", "Проверяет бронепробитие", "Ждёт пополнения экипажа", "Сбивает гусеницу", "Наводит артиллерию", "Летит на аэродром", "Фармит Очки Возрождения", "Вызывает дух Сталина"] }
        };

        let currentActivityName = "";
        let fixedStatusText = "";
        let textTimer = 0;

        function getNextText(gameKey) {
            let queue = JSON.parse(localStorage.getItem(`queue_${gameKey}`)) || [];
            if (queue.length === 0) {
                queue = [...gameStatusData[gameKey].texts].sort(() => Math.random() - 0.5);
            }
            const next = queue.shift();
            localStorage.setItem(`queue_${gameKey}`, JSON.stringify(queue));
            return next;
        }

        function formatTime(startMs) {
            const diff = Math.floor((Date.now() - startMs) / 1000);
            const h = Math.floor(diff / 3600).toString().padStart(2, '0');
            const m = Math.floor((diff % 3600) / 60).toString().padStart(2, '0');
            const s = (diff % 60).toString().padStart(2, '0');
            return `${h}:${m}:${s}`;
        }

        async function updateStatus() {
            try {
                const r = await fetch('https://api.lanyard.rest/v1/users/852876367871082519');
                const j = await r.json();
                if (!j.success) return;
                const d = j.data;
                const icon = document.getElementById('activity-icon');
                const sub = document.getElementById('activity-sub');
                const timeBox = document.getElementById('activity-time');
                const name = document.getElementById('activity-name');
                const label = document.getElementById('activity-label');
                document.getElementById('status-dot').style.background = { online: '#43b581', idle: '#faa61a', dnd: '#f04747', offline: '#747f8d' }[d.discord_status];
                
                const gameActivity = d.activities.find(x => x.type === 0);

                if (gameActivity) {
                    const n = gameActivity.name;
                    label.innerText = "Playing";
                    if (n !== currentActivityName || textTimer <= 0) {
                        currentActivityName = n;
                        textTimer = 45;
                        let gameKey = "";
                        const nl = n.toLowerCase();
                        if (nl.includes('star rail') || nl.includes('hsr')) gameKey = "hsr";
                        else if (nl.includes('endfield')) gameKey = "endfield";
                        else if (nl.includes('zenless') || nl.includes('zzz')) gameKey = "zzz";
                        else if (nl.includes('war thunder') || nl.includes('тундр')) gameKey = "tundra";
                        if (gameKey) {
                            fixedStatusText = getNextText(gameKey);
                            icon.innerHTML = `<img src="${gameStatusData[gameKey].icon}">`;
                        } else {
                            fixedStatusText = gameActivity.details || gameActivity.state || "";
                            icon.innerHTML = '<i class="fas fa-gamepad"></i>';
                        }
                    }
                    name.innerText = n;
                    sub.innerText = fixedStatusText;
                    timeBox.innerText = (gameActivity.timestamps && gameActivity.timestamps.start) ? formatTime(gameActivity.timestamps.start) : "";
                    textTimer--;
                } else if (d.listening_to_spotify) {
                    label.innerText = "Listening to Spotify";
                    name.innerText = d.spotify.song;
                    sub.innerText = d.spotify.artist;
                    timeBox.innerText = "";
                    icon.innerHTML = `<img src="${d.spotify.album_art_url}">`;
                    currentActivityName = "spotify";
                } else {
                    label.innerText = "Status";
                    name.innerText = "Currently Idling";
                    sub.innerText = d.discord_status.toUpperCase();
                    timeBox.innerText = "";
                    icon.innerHTML = '<i class="fas fa-ghost"></i>';
                    currentActivityName = "";
                }
            } catch (e) {}
        }
        setInterval(updateStatus, 1000);
        updateStatus();
    </script>
