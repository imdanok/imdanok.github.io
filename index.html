<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Im_Danokツ | Space</title>
    <link rel="icon" type="image/jpeg" href="galera1.jpg">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        :root {
            --neon: #bc13fe;
            --status-color: #747f8d;
        }

        body {
            background: #050505;
            color: #fff;
            font-family: 'Inter', sans-serif;
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            margin: 0;
        }

        .card {
            background: rgba(255, 255, 255, 0.02);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.05);
            padding: 50px 30px;
            border-radius: 35px;
            text-align: center;
            width: 300px;
            box-shadow: 0 0 50px rgba(0,0,0,0.5);
        }

        .avatar-wrapper {
            position: relative;
            width: 120px;
            height: 120px;
            margin: 0 auto 20px;
        }

        .avatar {
            width: 100%;
            height: 100%;
            border-radius: 50%;
            object-fit: cover;
            border: 2px solid var(--neon);
            box-shadow: 0 0 20px rgba(188, 19, 254, 0.3);
            
            /* ЗАЩИТА АВАТАРКИ */
            user-select: none;
            -webkit-user-drag: none;
            -webkit-touch-callout: none;
        }

        .status-dot {
            position: absolute;
            bottom: 8px;
            right: 8px;
            width: 18px;
            height: 18px;
            border-radius: 50%;
            background: var(--status-color);
            border: 3px solid #0b0b0b;
            box-shadow: 0 0 10px var(--status-color);
            transition: all 0.5s ease;
        }

        .title-container {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            margin-bottom: 5px;
        }

        h1 {
            margin: 0;
            font-size: 24px;
            font-weight: 700;
            color: #ffffff;
            text-shadow: 0 0 10px rgba(255, 255, 255, 0.5), 0 0 20px var(--neon);
            user-select: none; /* Чтобы ник тоже нельзя было выделить */
        }

        .separator {
            width: 1px;
            height: 18px;
            background: rgba(255, 255, 255, 0.2);
        }

        .links-label {
            font-size: 11px;
            letter-spacing: 2px;
            color: var(--neon);
            text-transform: uppercase;
            font-weight: 800;
            opacity: 0.8;
            user-select: none;
        }

        #ds-status {
            font-size: 10px;
            color: rgba(255, 255, 255, 0.4);
            margin-bottom: 25px;
            text-transform: uppercase;
            letter-spacing: 1px;
            min-height: 12px;
            user-select: none;
        }

        .links {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .btn {
            position: relative;
            padding: 14px;
            border-radius: 15px;
            text-decoration: none;
            color: rgba(255, 255, 255, 0.6);
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid rgba(255, 255, 255, 0.05);
            transition: all 0.3s ease;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;

            /* ЗАЩИТА КНОПОК */
            user-select: none;
            -webkit-user-drag: none;
        }

        .btn i { position: absolute; left: -35px; transition: 0.3s; font-size: 18px; }
        .btn:hover { color: #fff; padding-left: 35px; background: rgba(188, 19, 254, 0.1); border-color: var(--neon); transform: translateY(-2px); }
        .btn:hover i { left: 20px; }

        .tg:hover { background: #24A1DE; }
        .ds:hover { background: #5865F2; }
        .st:hover { background: #171a21; border-color: #66c0f4; }
        .fp:hover { background: #ff8200; }
        .mn:hover { background: #bc13fe; }

        .footer { height: 15px; }
    </style>
</head>
<body>

    <div class="card">
        <div class="avatar-wrapper">
            <img src="avatar.png" alt="Im_Danokツ" class="avatar" draggable="false" oncontextmenu="return false;">
            <div id="status-dot" class="status-dot"></div>
        </div>
        
        <div class="title-container">
            <h1>Im_Danokツ</h1>
            <div class="separator"></div>
            <div class="links-label">LINKS</div>
        </div>
        <div id="ds-status">Connecting...</div>
        
        <div class="links">
            <a href="https://t.me/Im_Danok" class="btn tg" target="_blank" draggable="false"><i class="fab fa-telegram-plane"></i>Telegram</a>
            <a href="https://discordapp.com/users/852876367871082519" class="btn ds" target="_blank" draggable="false"><i class="fab fa-discord"></i>Discord</a>
            <a href="https://steamcommunity.com/id/im_danok/" class="btn st" target="_blank" draggable="false"><i class="fab fa-steam"></i>Steam</a>
            <a href="https://funpay.com/users/8726493/" class="btn fp" target="_blank" draggable="false"><i class="fas fa-bolt"></i>FunPay</a>
            <a href="https://mynickname.com/Im_Danok" class="btn mn" target="_blank" draggable="false"><i class="fas fa-id-card"></i>MyNickname</a>
        </div>

        <div class="footer"></div>
    </div>

    <script>
        const USER_ID = "852876367871082519";
        const statusDot = document.getElementById('status-dot');
        const statusText = document.getElementById('ds-status');

        async function updateStatus() {
            try {
                const response = await fetch(`https://api.lanyard.rest/v1/users/${USER_ID}`);
                const res = await response.json();
                if (res.success) {
                    const data = res.data;
                    const status = data.discord_status;
                    const colors = { online: '#43b581', idle: '#faa61a', dnd: '#f04747', offline: '#747f8d' };
                    statusDot.style.background = colors[status];
                    statusDot.style.boxShadow = `0 0 10px ${colors[status]}`;
                    
                    if (data.listening_to_spotify) {
                        statusText.innerText = `Listening to Spotify`;
                    } else if (data.activities.length > 0) {
                        const act = data.activities.find(a => a.type === 0) || data.activities[0];
                        statusText.innerText = act.name;
                    } else {
                        statusText.innerText = status;
                    }
                }
            } catch (e) { statusText.innerText = "OFFLINE"; }
        }

        setInterval(updateStatus, 15000);
        updateStatus();
    </script>
</body>
</html>
