<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Im_Danokツ | Space</title>
    <link rel="icon" type="image/jpeg" href="galera1.jpg">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        :root { --neon: #bc13fe; --status-color: #747f8d; }
        body { background: #000; color: #fff; font-family: 'Inter', sans-serif; display: flex; align-items: center; justify-content: center; min-height: 100vh; margin: 0; overflow: hidden; user-select: none; -webkit-user-select: none; cursor: none; }
        a, button, .btn, .avatar, video { cursor: none !important; }
        #cursor { position: fixed; top: 0; left: 0; width: 26px; height: 26px; z-index: 9999; pointer-events: none; will-change: transform; background-image: url('data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24"><path fill="white" stroke="%23bc13fe" stroke-width="2" d="M7 2l12 11.2l-5.8 0.5L17 20l-3 1.3l-3.7-8.3L7 16z"/></svg>'); filter: drop-shadow(0 0 8px var(--neon)); }
        #bg-video { position: fixed; top: 50%; left: 50%; min-width: 100%; min-height: 100%; z-index: -100; transform: translate(-50%, -50%); object-fit: cover; filter: brightness(0.3) contrast(1.1); pointer-events: none; }
        @keyframes boxPulse { 0% { box-shadow: 0 0 10px rgba(188, 19, 254, 0.1); transform: scale(1); } 50% { box-shadow: 0 0 25px rgba(188, 19, 254, 0.4); transform: scale(1.02); } 100% { box-shadow: 0 0 10px rgba(188, 19, 254, 0.1); transform: scale(1); } }
        .pulse-active { animation: boxPulse 2.5s infinite ease-in-out; }
        .card { background: rgba(0, 0, 0, 0.6); backdrop-filter: blur(20px); border: 1px solid rgba(255, 255, 255, 0.08); padding: 40px 30px; border-radius: 35px; text-align: center; width: 320px; box-shadow: 0 0 50px rgba(0,0,0,0.8); z-index: 1; transition: all 0.8s ease; }
        .avatar-wrapper { position: relative; width: 110px; height: 110px; margin: 0 auto 15px; }
        .avatar { width: 100%; height: 100%; border-radius: 50%; object-fit: cover; border: 2px solid var(--neon); box-shadow: 0 0 25px rgba(188, 19, 254, 0.5); }
        .status-dot { position: absolute; bottom: 5px; right: 5px; width: 18px; height: 18px; border-radius: 50%; background: var(--status-color); border: 3px solid #0b0b0b; }
        .title-container { display: flex; align-items: center; justify-content: center; gap: 10px; margin-bottom: 5px; }
        h1 { margin: 0; font-size: 22px; text-shadow: 0 0 15px var(--neon); }
        .separator { width: 1px; height: 18px; background: rgba(255, 255, 255, 0.2); }
        .links-label { font-size: 11px; letter-spacing: 2px; color: var(--neon); text-transform: uppercase; font-weight: 800; opacity: 0.8; }
        .activity-box { background: rgba(255, 255, 255, 0.03); border-radius: 20px; padding: 15px; margin: 15px 0 25px; display: flex; align-items: center; gap: 12px; text-align: left; border: 1px solid rgba(255, 255, 255, 0.05); }
        .activity-icon { width: 50px; height: 50px; border-radius: 12px; background: rgba(188, 19, 254, 0.1); display: flex; align-items: center; justify-content: center; font-size: 20px; box-shadow: 0 0 10px var(--neon); overflow: hidden; flex-shrink: 0; }
        .activity-icon img { width: 100%; height: 100%; object-fit: cover; }
        .activity-info { display: flex; flex-direction: column; overflow: hidden; }
        .activity-label { font-size: 9px; text-transform: uppercase; letter-spacing: 1px; color: var(--neon); font-weight: 800; }
        .activity-name { font-size: 13px; font-weight: 600; color: #fff; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        .activity-sub { font-size: 11px; color: rgba(255, 255, 255, 0.5); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        .links { display: flex; flex-direction: column; gap: 12px; }
        .btn { position: relative; padding: 14px; border-radius: 15px; text-decoration: none; color: rgba(255, 255, 255, 0.6); background: rgba(255, 255, 255, 0.03); border: 1px solid rgba(255, 255, 255, 0.05); transition: 0.3s; display: flex; align-items: center; justify-content: center; overflow: hidden; }
        .btn i { position: absolute; left: -35px; transition: 0.3s; font-size: 18px; }
        .btn:hover { color: #fff; padding-left: 35px; background: rgba(188, 19, 254, 0.1); border-color: var(--neon); transform: translateY(-2px); }
        .btn:hover i { left: 20px; }
        .tg:hover { background: #24A1DE; } .ds:hover { background: #5865F2; } .st:hover { background: #171a21; } .fp:hover { background: #ff8200; } .mn:hover { background: #bc13fe; }
    </style>
</head>
<body>
    <div id="cursor"></div>
    <video autoplay muted loop playsinline id="bg-video"><source src="video1.mp4" type="video/mp4"></video>
    <div class="card">
        <div class="avatar-wrapper"><img src="avatar.png" class="avatar"><div id="status-dot" class="status-dot"></div></div>
        <div class="title-container"><h1>Im_Danokツ</h1><div class="separator"></div><div class="links-label">LINKS</div></div>
        <div class="activity-box" id="activity-box">
            <div class="activity-icon" id="activity-icon"></div>
            <div class="activity-info"><span class="activity-label" id="activity-label">Status</span><span class="activity-name" id="activity-name">Connecting...</span><span class="activity-sub" id="activity-sub"></span></div>
        </div>
        <div class="links">
            <a href="https://t.me/Im_Danok" class="btn tg" target="_blank"><i class="fab fa-telegram-plane"></i>Telegram</a>
            <a href="https://discordapp.com/users/852876367871082519" class="btn ds" target="_blank"><i class="fab fa-discord"></i>Discord</a>
            <a href="https://steamcommunity.com/id/im_danok/" class="btn st" target="_blank"><i class="fab fa-steam"></i>Steam</a>
            <a href="https://funpay.com/users/8726493/" class="btn fp" target="_blank"><i class="fas fa-bolt"></i>FunPay</a>
            <a href="https://mynickname.com/Im_Danok" class="btn mn" target="_blank"><i class="fas fa-id-card"></i>MyNickname</a>
        </div>
    </div>
    <script>
        const cursor = document.getElementById('cursor');
        document.addEventListener('mousemove', (e) => { cursor.style.transform = `translate3d(${e.clientX}px, ${e.clientY}px, 0)`; });
        document.addEventListener('mouseleave', () => cursor.style.display = 'none');
        document.addEventListener('mouseenter', () => cursor.style.display = 'block');

        const geminiSVG = "data:image/svg+xml;base64,PHN2ZyB4bWxucz0iaHR0cDovL3d3dy53My5vcmcvMjAwMC9zdmciIHZpZXdCb3g9IjAgMCAyNCAyNCI+PHBhdGggZmlsbD0iI2JjMTNmZSIgZD0iTTEyIDJMMTQuOCA5LjJMMjIgMTJMMTQuOCAxNC44TDEyIDIyTDkuMiAxNC44TDIgMTJMOS4yIDkuMkwxMiAyWiIvPjwvc3ZnPg==";

        async function updateStatus() {
            try {
                const r = await fetch('https://api.lanyard.rest/v1/users/852876367871082519');
                const j = await r.json();
                if (!j.success) return;
                const d = j.data;
                const colors = { online: '#43b581', idle: '#faa61a', dnd: '#f04747', offline: '#747f8d' };
                document.getElementById('status-dot').style.background = colors[d.discord_status];
                
                const iconContainer = document.getElementById('activity-icon');
                const box = document.getElementById('activity-box');

                if (d.listening_to_spotify) {
                    document.getElementById('activity-label').innerText = "Listening to Spotify";
                    document.getElementById('activity-name').innerText = d.spotify.song;
                    document.getElementById('activity-sub').innerText = d.spotify.artist;
                    iconContainer.innerHTML = `<img src="${d.spotify.album_art_url}">`;
                    box.classList.add('pulse-active');
                } else if (d.activities.length > 0) {
                    const a = d.activities.find(x => x.type === 0) || d.activities[0];
                    document.getElementById('activity-label').innerText = "Playing";
                    document.getElementById('activity-name').innerText = a.name;
                    document.getElementById('activity-sub').innerText = a.details || a.state || "";
                    box.classList.remove('pulse-active');

                    if (a.name.toLowerCase().includes('gemini')) {
                        iconContainer.innerHTML = `<img src="${geminiSVG}">`;
                    } else if (a.assets && a.assets.large_image) {
                        let img = a.assets.large_image.includes('external') 
                            ? `https://images.weserv.nl/?url=${a.assets.large_image.split('https/')[1]}`
                            : `https://cdn.discordapp.com/app-assets/${a.application_id}/${a.assets.large_image}.png`;
                        iconContainer.innerHTML = `<img src="${img}" onerror="this.parentElement.innerHTML='<i class=\'fas fa-gamepad\'></i>'">`;
                    } else {
                        iconContainer.innerHTML = '<i class="fas fa-gamepad"></i>';
                    }
                } else {
                    document.getElementById('activity-label').innerText = "Status";
                    document.getElementById('activity-name').innerText = d.discord_status.toUpperCase();
                    document.getElementById('activity-sub').innerText = "";
                    iconContainer.innerHTML = '<i class="fas fa-ghost"></i>';
                    box.classList.remove('pulse-active');
                }
            } catch (e) {}
        }
        setInterval(updateStatus, 15000); updateStatus();
    </script>
</body>
</html>
